[package]
name = "mars-command-client"
display-name = "Mars Client"
version = "1.4.1"
description = "A client application for managing Mars Command operations"
authors = ["Jay Nightmare <jn3.enquiries@gmail.com>"]
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "mars_command_client_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
base64 = "0.22"
minisign-verify = "0.3"

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
fastnbt = "2"
flate2 = "1"
fs2 = "0.4.3"
tokio = { version = "1", features = ["net", "io-util", "time", "rt", "sync", "fs"] }
futures-util = "0.3"
hickory-resolver = { version = "0.24", default-features = false, features = ["tokio-runtime", "system-config"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
tauri-plugin-dialog = "2"
tauri-plugin-updater = "=2.13.3"
base64 = "0.22"
minisign-verify = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "charset", "http2", "json", "blocking", "stream"] }
ed25519-dalek = { version = "2", default-features = false, features = ["std"] }
sha2 = "0.10"
sha1 = "0.10"
hex = "0.4"
walkdir = "2"
url = "2"
dotenvy = "0.15"
tempfile = "3"
zip = { version = "2", default-features = false, features = ["deflate"] }
toml = "0.8"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }

[dev-dependencies]
rand_core = { version = "0.6", features = ["getrandom"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
