name: Publish pack manifest

on:
    workflow_dispatch:
        inputs:
            pack_version:
                description: "Pack version (e.g. 1.3.0)"
                required: true
            export_dir:
                description: "Repository path containing the small CurseForge manifest.json (overrides optional)"
                required: true
                default: "modpack/Mars"
            source_release:
                description: "Optional existing release tag containing an already signed manifest pair"
                required: false
                default: ""
            payload_asset:
                description: "Optional JAR asset in that release, installed under mods after hash verification"
                required: false
                default: ""
            prerelease:
                description: "Publish as a pre-release (not served to users)"
                type: boolean
                default: false

permissions:
    contents: write

concurrency:
    group: mars-pack-manifest-release
    cancel-in-progress: false

jobs:
    publish:
        runs-on: ubuntu-latest
        env:
            MARS_UPDATER_PUBLIC_KEY: ${{ vars.MARS_UPDATER_PUBLIC_KEY }}
        steps:
            - uses: actions/checkout@v4

            - name: Test staged payload deployment
              run: python3 -m unittest discover -s scripts -p test_deploy_pack_release.py

            - name: Download existing signed pack
              if: ${{ inputs.source_release != '' }}
              env:
                  GH_TOKEN: ${{ github.token }}
                  SOURCE_RELEASE: ${{ inputs.source_release }}
                  PACK_VERSION: ${{ inputs.pack_version }}
                  PAYLOAD_ASSET: ${{ inputs.payload_asset }}
              shell: bash
              run: |
                  set -euo pipefail
                  [[ "$SOURCE_RELEASE" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$ ]]
                  [[ "$PACK_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
                  mkdir -p manifest-dist
                  gh release download "$SOURCE_RELEASE" --repo "$GITHUB_REPOSITORY" \
                    --pattern manifest.json --pattern manifest.json.sig --dir manifest-dist
                  python3 - <<'PY'
                  import json, os
                  from pathlib import Path
                  path = Path("manifest-dist/manifest.json")
                  assert path.stat().st_size <= 8 * 1024 * 1024, "Manifest exceeds 8 MiB"
                  manifest = json.loads(path.read_text(encoding="utf-8"))
                  assert manifest["packVersion"] == os.environ["PACK_VERSION"], "Pack version differs"
                  assert manifest["minecraftVersion"] == "1.21.1", "Minecraft version differs"
                  assert manifest["loader"] == "neoforge" and manifest["loaderVersion"] == "21.1.250", "Loader differs"
                  PY
                  if [[ -n "$PAYLOAD_ASSET" ]]; then
                    [[ "$PAYLOAD_ASSET" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*\.jar$ ]]
                    mkdir -p release-payload
                    gh release download "$SOURCE_RELEASE" --repo "$GITHUB_REPOSITORY" \
                      --pattern "$PAYLOAD_ASSET" --dir release-payload
                    python3 - <<'PY'
                  import hashlib, json, os
                  from pathlib import Path
                  name = os.environ["PAYLOAD_ASSET"]
                  entries = json.loads(Path("manifest-dist/manifest.json").read_text(encoding="utf-8"))["files"]
                  matches = [entry for entry in entries if entry["path"] == "mods/" + name]
                  assert len(matches) == 1, "Payload must be declared exactly once"
                  entry = matches[0]
                  path = Path("release-payload") / name
                  assert path.stat().st_size <= 64 * 1024 * 1024, "Payload exceeds 64 MiB"
                  assert path.stat().st_size == entry["size"], "Payload size differs"
                  assert hashlib.sha256(path.read_bytes()).hexdigest() == entry["sha256"], "Payload hash differs"
                  PY
                  fi

            - uses: dtolnay/rust-toolchain@stable

            - name: Install Tauri Linux dependencies
              run: |
                  sudo apt-get update
                  sudo apt-get install --no-install-recommends -y \
                    build-essential \
                    curl \
                    file \
                    libayatana-appindicator3-dev \
                    libglib2.0-dev \
                    libgtk-3-dev \
                    libssl-dev \
                    libwebkit2gtk-4.1-dev \
                    librsvg2-dev \
                    libxdo-dev \
                    wget

            - uses: Swatinem/rust-cache@v2
              with:
                  workspaces: src-tauri

            - name: Build manifest from CurseForge export
              if: ${{ inputs.source_release == '' }}
              working-directory: src-tauri
              env:
                  CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
                  CURSEFORGE_API_URL: https://api.curseforge.com
                  EXPORT_DIR: ${{ inputs.export_dir }}
              run: |
                  if [ -z "$CURSEFORGE_API_KEY" ]; then
                    echo "::error::CURSEFORGE_API_KEY secret is not set"
                    exit 1
                  fi
                  ENCODED_EXPORT_DIR="$(python3 -c 'import os, urllib.parse; print(urllib.parse.quote(os.environ["EXPORT_DIR"], safe="/"))')"
                  export MARS_OVERRIDE_BASE_URL="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_SHA}/${ENCODED_EXPORT_DIR}/overrides"
                  mkdir -p ../manifest-dist
                  cargo run --release --example manifest_tool -- \
                    cf-pack "../${{ inputs.export_dir }}" \
                    "${{ inputs.pack_version }}" \
                    ../manifest-dist/manifest.json

            - name: Sign manifest
              if: ${{ inputs.source_release == '' }}
              working-directory: src-tauri
              env:
                  MARS_SIGNING_KEY: ${{ secrets.MARS_SIGNING_KEY }}
              run: |
                  if [ -z "$MARS_SIGNING_KEY" ]; then
                    echo "::error::MARS_SIGNING_KEY secret is not set"
                    exit 1
                  fi
                  KEY_FILE="$(mktemp)"
                  printf '%s' "$MARS_SIGNING_KEY" > "$KEY_FILE"
                  cargo run --release --example manifest_tool -- sign "$KEY_FILE" ../manifest-dist/manifest.json
                  shred -u "$KEY_FILE" 2>/dev/null || rm -f "$KEY_FILE"

            - name: Verify signature
              working-directory: src-tauri
              run: cargo run --release --example manifest_tool -- verify ../manifest-dist/manifest.json

            - name: Publish release
              if: ${{ inputs.source_release == '' }}
              uses: softprops/action-gh-release@v2
              with:
                  tag_name: pack-v${{ inputs.pack_version }}-manifest-${{ github.run_number }}
                  name: Mars Pack ${{ inputs.pack_version }}
                  prerelease: ${{ inputs.prerelease }}
                  make_latest: false
                  files: |
                      manifest-dist/manifest.json
                      manifest-dist/manifest.json.sig

            - name: Deploy signed manifest to Mars API
              if: ${{ inputs.prerelease == false }}
              env:
                  MARS_DEPLOY_HOST: ${{ secrets.MARS_DEPLOY_HOST }}
                  MARS_DEPLOY_USER: ${{ secrets.MARS_DEPLOY_USER }}
                  MARS_DEPLOY_SSH_KEY: ${{ secrets.MARS_DEPLOY_SSH_KEY }}
                  MARS_DEPLOY_KNOWN_HOSTS: ${{ secrets.MARS_DEPLOY_KNOWN_HOSTS }}
                  PAYLOAD_ASSET: ${{ inputs.payload_asset }}
              run: |
                  set -euo pipefail
                  : "${MARS_DEPLOY_HOST:?MARS_DEPLOY_HOST secret is not set}"
                  : "${MARS_DEPLOY_USER:?MARS_DEPLOY_USER secret is not set}"
                  : "${MARS_DEPLOY_SSH_KEY:?MARS_DEPLOY_SSH_KEY secret is not set}"
                  : "${MARS_DEPLOY_KNOWN_HOSTS:?MARS_DEPLOY_KNOWN_HOSTS secret is not set}"

                  RELEASE_DIR="/opt/mars-package-api/releases/1.0.0"
                  RUN_SUFFIX="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
                  STAGING_DIR="${RELEASE_DIR}/.incoming-${RUN_SUFFIX}"
                  REMOTE="${MARS_DEPLOY_USER}@${MARS_DEPLOY_HOST}"
                  KEY_FILE="$(mktemp)"
                  KNOWN_HOSTS_FILE="$(mktemp)"
                  cleanup() {
                    ssh -i "$KEY_FILE" -p 22 \
                      -o IdentitiesOnly=yes \
                      -o BatchMode=yes \
                      -o StrictHostKeyChecking=yes \
                      -o "UserKnownHostsFile=$KNOWN_HOSTS_FILE" \
                      "$REMOTE" "rm -rf '$STAGING_DIR'" >/dev/null 2>&1 || true
                    rm -f "$KEY_FILE" "$KNOWN_HOSTS_FILE" \
                      "${REMOTE_MANIFEST:-}" "${REMOTE_SIGNATURE:-}"
                  }
                  trap cleanup EXIT

                  printf '%s\n' "$MARS_DEPLOY_SSH_KEY" > "$KEY_FILE"
                  printf '%s\n' "$MARS_DEPLOY_KNOWN_HOSTS" > "$KNOWN_HOSTS_FILE"
                  chmod 600 "$KEY_FILE" "$KNOWN_HOSTS_FILE"

                  SSH_ARGS=(
                    -i "$KEY_FILE"
                    -p 22
                    -o IdentitiesOnly=yes
                    -o BatchMode=yes
                    -o StrictHostKeyChecking=yes
                    -o "UserKnownHostsFile=$KNOWN_HOSTS_FILE"
                    -o ConnectTimeout=15
                  )
                  ssh "${SSH_ARGS[@]}" "$REMOTE" "mkdir -p '$STAGING_DIR'"
                  scp -i "$KEY_FILE" -P 22 \
                    -o IdentitiesOnly=yes \
                    -o BatchMode=yes \
                    -o StrictHostKeyChecking=yes \
                    -o "UserKnownHostsFile=$KNOWN_HOSTS_FILE" \
                    manifest-dist/manifest.json \
                    manifest-dist/manifest.json.sig \
                    "${REMOTE}:${STAGING_DIR}/"

                  if [[ -n "$PAYLOAD_ASSET" ]]; then
                    [[ "$PAYLOAD_ASSET" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*\.jar$ ]]
                    ssh "${SSH_ARGS[@]}" "$REMOTE" "mkdir -p '$STAGING_DIR/mods'"
                    scp -i "$KEY_FILE" -P 22 \
                      -o IdentitiesOnly=yes \
                      -o BatchMode=yes \
                      -o StrictHostKeyChecking=yes \
                      -o "UserKnownHostsFile=$KNOWN_HOSTS_FILE" \
                      "release-payload/$PAYLOAD_ASSET" "${REMOTE}:${STAGING_DIR}/mods/"
                  fi

                  ssh "${SSH_ARGS[@]}" "$REMOTE" \
                    "python3 - '$RELEASE_DIR' '$STAGING_DIR' '$RUN_SUFFIX'" < scripts/deploy-pack-release.py
                  ssh "${SSH_ARGS[@]}" "$REMOTE" \
                    "sudo -n systemctl restart mars-package-api"

                  REMOTE_MANIFEST="$(mktemp)"
                  REMOTE_SIGNATURE="$(mktemp)"
                  curl --fail --silent --show-error --retry 5 --retry-delay 2 \
                    -H 'Cache-Control: no-cache' \
                    "https://api.nexusgit.info/api/v1/manifest.json?deploy=${RUN_SUFFIX}" \
                    --output "$REMOTE_MANIFEST"
                  curl --fail --silent --show-error --retry 5 --retry-delay 2 \
                    -H 'Cache-Control: no-cache' \
                    "https://api.nexusgit.info/api/v1/manifest.json.sig?deploy=${RUN_SUFFIX}" \
                    --output "$REMOTE_SIGNATURE"
                  cmp manifest-dist/manifest.json "$REMOTE_MANIFEST"
                  cmp manifest-dist/manifest.json.sig "$REMOTE_SIGNATURE"
